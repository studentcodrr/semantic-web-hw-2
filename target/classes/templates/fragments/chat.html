<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Chat Fragment -->
<div th:fragment="chat">
    <!-- Chat Toggle Button (shows when minimized) -->
    <button id="chat-toggle" onclick="openChat()">💬</button>

    <!-- Chat Widget Container -->
    <div id="chat-widget">
        <div id="chat-container" class="hidden">
            <!-- Chat Header -->
            <div id="chat-header">
                <h3>Book Assistant</h3>
                <button id="chat-minimize" onclick="closeChat()">−</button>
            </div>

            <!-- Conversation Starters -->
            <div id="chat-starters">
                <!-- Dynamically loaded starters -->
            </div>

            <!-- Chat Messages -->
            <div id="chat-messages">
                <div class="chat-message message-bot">
                    <div class="message-bubble">
                        Hello! I'm your book recommendation assistant. How can I help you today?
                    </div>
                </div>
            </div>

            <!-- Typing Indicator -->
            <div id="typing-indicator" class="chat-message message-bot">
                <div class="typing-indicator">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>

            <!-- Chat Input -->
            <div id="chat-input-container">
                    <textarea
                            id="chat-input"
                            placeholder="Type your message..."
                            rows="1"
                            onkeypress="handleKeyPress(event)"></textarea>
                <button id="chat-send" onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload RDF File</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">

</head>

<body>
    <nav>
        <div class="nav-container">
            <h1>Book Recommendation System</h1>
            <ul>
                <li><a th:href="@{/}">Home</a></li>
                <li><a th:href="@{/books}">Books</a></li>
                <li><a th:href="@{/upload}">Upload RDF</a></li>
                <li><a th:href="@{/manage-book}">Add Book</a></li>
                <form th:action="@{/select-user}" method="post" class="user-form">
                    <label for="user-select" style="color: white; margin-right: 10px;">User:</label>
                    <select name="userId" id="user-select" onchange="this.form.submit()" class="btn-small">
                        <option value="">Select User</option>
                        <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.name}"
                            th:selected="${session.currentUserId == u.id}">
                        </option>
                    </select>
                </form>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h2>Upload and Visualize RDF/XML File</h2>

        <div class="upload-section">
            <form id="upload-form" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="rdfFile">Select RDF/XML File:</label>
                    <input type="file" id="rdfFile" name="rdfFile" accept=".rdf,.xml" required>
                    <small>Upload your books.rdf file or any valid RDF/XML file</small>
                </div>
                <button type="submit" class="btn">Upload and Visualize</button>
            </form>

            <div id="status"></div>
        </div>

        <div id="graph-container" style="display: none;">
            <h3>RDF Graph Visualization</h3>
            <div id="rdf-graph"></div>
        </div>
    </div>

    <script src="https://unpkg.com/vis-network@9.1.2/standalone/umd/vis-network.min.js"></script>
    <script th:inline="javascript">
        /*<![CDATA[*/
        if (typeof vis === 'undefined') {
            console.error('vis-network library failed to load');
            document.getElementById('status').innerHTML = '<p class="error">Visualization library failed to load.</p>';
        }

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fileInput = document.getElementById('rdfFile');
            if (!fileInput.files || !fileInput.files[0]) {
                document.getElementById('status').innerHTML = '<p class="error">Please select a file first.</p>';
                return;
            }

            const formData = new FormData();
            formData.append('rdfFile', fileInput.files[0]);

            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<p class="loading">Uploading and parsing RDF file...</p>';

            try {
                const response = await fetch('/upload-rdf', {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();

                if (result.success) {
                    statusDiv.innerHTML = '<p class="success">File uploaded successfully. Found ' + result.triples.length + ' triples.</p>';
                    document.getElementById('graph-container').style.display = 'block';
                    visualizeRDF(result.triples);
                } else {
                    statusDiv.innerHTML = '<p class="error">Error: ' + result.error + '</p>';
                }
            } catch (error) {
                statusDiv.innerHTML = '<p class="error">Error uploading file: ' + error.message + '</p>';
            }
        });

        function visualizeRDF(triples) {
            if (typeof vis === 'undefined') return;

            const nodes = new Map();
            const edges = [];

            function shortName(uri) {
                if (!uri) return 'Unknown';
                if (uri.includes('#')) return uri.split('#').pop();
                if (uri.includes('/')) return uri.split('/').pop();
                return uri;
            }

            function nodeType(uri) {
                if (uri.includes('Book')) return 'book';
                if (uri.includes('Theme')) return 'theme';
                if (uri.includes('Level')) return 'level';
                if (uri.includes('User')) return 'user';
                return 'other';
            }

            function nodeStyle(type) {
                switch (type) {
                    case 'book':
                        return { shape: 'box', color: '#3498db' };
                    case 'theme':
                        return { shape: 'dot', color: '#e67e22' };
                    case 'level':
                        return { shape: 'triangle', color: '#9b59b6' };
                    case 'user':
                        return { shape: 'diamond', color: '#27ae60' };
                    default:
                        return { shape: 'dot', color: '#7f8c8d' };
                }
            }

            function addNode(id) {
                if (nodes.has(id)) return;

                const type = nodeType(id);
                const style = nodeStyle(type);

                nodes.set(id, {
                    id,
                    label: shortName(id),
                    shape: style.shape,
                    color: style.color,
                    font: { color: '#fff' }
                });
            }

            triples.forEach((triple, index) => {
                const subject = triple.subject;
                const predicate = shortName(triple.predicate);

                addNode(subject);

                if (triple.objectType === 'NamedNode') {
                    addNode(triple.object);

                    edges.push({
                        from: subject,
                        to: triple.object,
                        label: predicate,
                        arrows: 'to'
                    });
                } else {
                    const literalId = `literal_${index}`;

                    nodes.set(literalId, {
                        id: literalId,
                        label: triple.object,
                        shape: 'box',
                        color: '#ecf0f1',
                        font: { color: '#000' }
                    });

                    edges.push({
                        from: subject,
                        to: literalId,
                        label: predicate,
                        arrows: 'to',
                        dashes: true
                    });
                }
            });

            const data = {
                nodes: new vis.DataSet([...nodes.values()]),
                edges: new vis.DataSet(edges)
            };

            const options = {
                nodes: {
                    borderWidth: 2
                },
                edges: {
                    smooth: true
                },
                physics: {
                    stabilization: true
                }
            };

            new vis.Network(document.getElementById('rdf-graph'), data, options);
        }

        /*]]>*/
    </script>
    <!-- Chat Widget -->
    <div th:replace="~{fragments/chat :: chat}"></div>
    <script th:src="@{/js/chat.js}"></script>
</body>

</html>

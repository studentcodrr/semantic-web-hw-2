<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Recommendation System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/chat.css}">
</head>

<body>
    <nav>
        <div class="nav-container">
            <h1>Book Recommendation System</h1>
            <ul>
                <li><a th:href="@{/}">Home</a></li>
                <li><a th:href="@{/books}">Books</a></li>
                <li><a th:href="@{/upload}">Upload RDF</a></li>
                <li><a th:href="@{/manage-book}">Add Book</a></li>
            </ul>
            <form th:action="@{/select-user}" method="post" class="user-form">
                <label for="user-select" style="color: white; margin-right: 10px;">User:</label>
                <select name="userId" id="user-select" onchange="this.form.submit()" class="btn-small">
                    <option value="">Select User</option>
                    <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.name}"
                        th:selected="${session.currentUserId == u.id}">
                    </option>
                </select>
            </form>
        </div>
    </nav>

    <div class="container">
        <div class="hero">
            <div class="feature-grid">
                <div class="feature-card">
                    <h3>Browse Books</h3>
                    <p>View all books in the collection</p>
                    <a th:href="@{/books}" class="btn">View Books</a>
                </div>

                <div class="feature-card">
                    <h3>Upload RDF</h3>
                    <p>Upload and visualize RDF/XML files</p>
                    <a th:href="@{/upload}" class="btn">Upload File</a>
                </div>

                <div class="feature-card">
                    <h3>Add Book</h3>
                    <p>Add new books to the collection</p>
                    <a th:href="@{/manage-book}" class="btn">Add Book</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Chat Widget -->
    <div th:replace="~{fragments/chat :: chat}"></div>
    <script th:src="@{/js/chat.js}"></script>
</body>

</html>
